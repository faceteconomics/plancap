url: https://faceteconomics.github.io/plancap/

template:
  bootstrap: 5
  light-switch: true

home:
  title: "plancap: plan-enabled development capacity"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

reference:
  - title: Rulebooks
    desc: >
      A rulebook holds every planning rule for one plan, with a citation for
      every value. Build one in R, or read it from YAML, JSON or a spreadsheet.
    contents:
      - rulebook
      - add_rules
      - set_rules
      - zone_family
      - read_rulebook
      - rulebook_template
      - rulebook_example
  - title: Zones
    desc: The rules a zone applies to every site in it.
    contents:
      - zone
      - height_limit
      - ratio
      - bands
      - building_form
      - density
      - use_mix
  - title: Setbacks
    desc: >
      Yards, recession and daylight planes, upper-level and height-proportional
      setbacks: every rule that keeps a building back from a boundary.
    contents:
      - yard
      - setback_distance
      - conditions
      - boundary_classes
  - title: Overlays, areas, bonuses and entitlements
    contents:
      - overlay
      - area
      - sub_area
      - bonus
      - unmodelled_rule
  - title: Checking and changing rulebooks
    contents:
      - validate_rulebook
      - rule_table
      - set_rule
      - convert_rulebook_units
      - rulebook_schema_path
  - title: Scenarios and site preparation
    desc: >
      A scenario is a rulebook with its parcels and maps. Preparing it turns
      parcels into sites with classified boundaries, ready for the engine;
      prepared steps are reused across scenarios that share their inputs.
    contents:
      - scenario
      - prepare_sites
      - clear_site_cache
  - title: The building envelope
    desc: >
      Each site's stack of storey footprints, clipped by every rule that
      applies at each height and capped by site ratios.
    contents:
      - build_envelopes
  - title: Capacity
    desc: Floor area and dwellings, by the path each zone's method sets.
    contents:
      - estimate_capacity
      - site_shape_factor
  - title: Comparing scenarios
    desc: >
      Plan changes as scenarios: run a set incrementally, compare each with
      the baseline (by site, zone transition, area and height), split the
      change into its drivers, and check that it all adds up.
    contents:
      - scenario_set
      - read_scenarios
      - compare_scenarios
      - diff_inputs
      - check_comparison
  - title: Summaries and checks
    desc: >
      Capacity by zone, height, site size, location or binding constraint;
      the floor area each kind of rule removes; one site explained; a rule
      swept through values; reconciliation; the register of rules not
      modelled.
    contents:
      - summarise_capacity
      - summary.plancap_capacity
      - capacity_table
      - constraint_breakdown
      - explain_site
      - sensitivity
      - check_capacity
      - unmodelled_report
  - title: Plots
    desc: >
      Every plot returns a ggplot object with one quiet theme, a validated
      colour-blind-safe palette in light and dark, and a caption stating what
      the figures are.
    contents:
      - plot_capacity
      - plot_comparison
      - plot_sensitivity
      - plot_site
      - autoplot.plancap_capacity
      - view_capacity_3d
      - theme_capacity
      - capacity_palette
  - title: Site and boundary types
    desc: >
      Road frontages, side and rear boundaries, corner, through and rear
      sites, access legs, water boundaries and road widths, each with the
      evidence for the call; the access width of rear sites; the front
      setbacks of the dwellings along a street.
    contents:
      - morphology
      - find_access_widths
      - find_existing_front_setbacks
      - check_morphology
  - title: Values, defaults and assumptions
    contents:
      - rule-formulas
      - rulebook_defaults
      - morphology_defaults
      - conversion
  - title: Example data
    desc: Exampleton, a synthetic town built to exercise every rule type.
    contents:
      - exampleton
      - exampleton_dem
      - exampleton_path
      - exampleton_pc1

articles:
  - title: Using plancap
    navbar: ~
    contents:
      - plancap
      - rulebooks
      - preparing-sites
      - summaries
      - comparing
  - title: Reference and method
    contents:
      - rule-reference
      - hamilton
      - method
