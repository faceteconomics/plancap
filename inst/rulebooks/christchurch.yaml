        boundaries: side
        source: CDP 14.4.2.7(i)
      - kind: yard
        name: rear
        distance: 1.0
        boundaries: rear
        source: CDP 14.4.2.7(i)
      - kind: plane
        angle_deg: 45.0
        start_height: 2.3
        angle_by_orientation:
          north: 55.0
          east: 45.0
          south: 30.0
          west: 45.0
        boundaries:
          - side
          - rear
        source: CDP 14.4.2.6, Appendix 14.16.2 Diagram B
    ratios:
