zones:
  RES_SUBURBAN:
    label: Residential Suburban Zone
    method: density
    height:
      value: 8.0
      storeys: 2.0
      source: CDP 14.4.2.3(i)
    setbacks:
      - kind: yard
        name: front
        distance: 4.5
        boundaries: road
        source: CDP 14.4.2.9(i)
      - kind: yard
        name: side
        distance: 1.0
        boundaries: side
        source: CDP 14.4.2.7(i)
      - kind: yard
        name: rear
        distance: 1.0
        boundaries: rear
        source: CDP 14.4.2.7(i)
      - kind: plane
        angle_deg: 39.0
        start_height: 2.3
        angle_by_orientation:
          north: 55.0
          east: 39.0
          south: 26.0
          west: 39.0
        boundaries:
          - side
          - rear
        source: CDP 14.4.2.6, Appendix 14.16.2 Diagram A
    ratios:
      coverage_max:
        value: 0.4
    density:
      large_site:
        area_per_dwelling: 450.0
      vacant_site_min_area: 450.0
      minor_dwellings_per_site: 1.0
      source: 'CDP 14.4.1.1 P2: a detached minor residential unit on a site holding
        one residential unit; 5.5 m, single storey (14.4.2.3(ii))'
    use:
      residential: yes
      business: no
    notes: Multi-unit residential complexes are provided for only in the Density Transition
      zone (14.4.1.1 P4), so this zone counts one unit per 450 m2. P10-P12 (conversion
      or replacement of one unit with two) are conditional on existing units and are
      not modelled.
  RES_SUBURBAN_DT:
    label: Residential Suburban Density Transition Zone
    method: volumetric
    height:
      value: 8.0
      storeys: 2.0
      source: CDP 14.4.2.3(i)
    setbacks:
      - kind: yard
        name: front
        distance: 4.5
        boundaries: road
        source: CDP 14.4.2.9(i)
      - kind: yard
