      residential: yes
      business: no
      residential_share: 1.0
    notes: Volumetric because multi-unit residential complexes are permitted to four
      units (14.4.1.1 P4) and restricted discretionary above (RD8), with no minimum
      net site area (14.4.2.1(iv)); the 330 m2 minimum governs only single units on
      their own sites.
