# Christchurch District Plan (Christchurch)
#
# Converted from capacityengine's ccc-dp-2025.yaml on 2026-11-20.
# A dated worked example, maintained by the package author: check the plan
# itself before relying on any value. Values carry their rule citation where
# the source bundle recorded one (validate_rulebook() lists those without).
# Fields the conversion could not carry are listed in the unmodelled_rules
# register and in data-raw/conversion/ in the package source.

schema_version: '0.1'
plan:
  name: Christchurch District Plan
  id: ccc-dp-2025
  jurisdiction: Christchurch
  country: NZ
  effective_date: '2025-09-19'
  units: m
  hemisphere: south
  source: Christchurch District Plan, ePlan text as updated 19 September 2025, read
    26 October 2026
  notes: Converted from the capacityengine bundle ccc-dp-2025.yaml by plancap data-raw/convert_capacityengine.R
    on 2026-11-20. Precinct areas match a precinct_key column holding the normalised
    precinct name.
defaults:
  storey_height: 3.0
  min_floorplate: 30.0
  level_reference: ceiling
  no_limit_height: 216.0
  large_site:
    method: divisor
    threshold: 10000.0
    deduction: 0.25
morphology:
  reserve_families: OPEN_SPACE_ANY
  rear_site_sides_as_rear: yes
conversion:
  dwelling_size: 120.0
  efficiency: 0.8
  min_one_dwelling: yes
  min_one_dwelling_floor: 60.0
  source: 'capacityengine conversion: 120 m2 a dwelling plus 0.2 circulation and 0.05
    storage. 150 m2 consumed per dwelling, as for Auckland (PC120 report p50).'
