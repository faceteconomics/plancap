unmodelled_rules:
  - zones:
      - RES_SUBURBAN
      - RES_SUBURBAN_DT
      - RES_MEDIUM_DENSITY
      - RES_HILLS
      - RES_BANKS_PENINSULA
      - RES_MRZ
      - RES_HRZ
      - BUS_TOWN_CENTRE
      - BUS_LOCAL_CENTRE
      - BUS_NEIGHBOURHOOD_CENTRE
    rule: Restricted discretionary breaches with no stated limit
    reason: 'User decision, 26 October 2026: restricted discretionary is part of capacity.
      Most breaches of height, recession planes, setbacks and coverage are restricted
      discretionary with no cap (e.g. 14.4.1.3 RD19, RD20, RD25, RD26; 14A.5.1.3 RD12-RD15;
      15.4.1.3 RD3-RD7), so there is no number to apply and the stated standard is
      used. Bounded bands are applied (see each zone).'
    likely_effect: understates
  - zones:
      - RES_MRZ
      - RES_HRZ
    rule: 'Chapter 14B pathway: pre-PC14 zone rules over the Residential Overlay'
    reason: An applicant may choose the former zone's rules instead of 14A (14.3).
      The former zones enable less than MRZ and HRZ almost everywhere, so the pathway
      rarely adds capacity; not modelled.
    likely_effect: understates
  - zones:
      - RES_SUBURBAN
      - RES_SUBURBAN_DT
      - RES_MEDIUM_DENSITY
      - RES_VISITOR_ACCOMMODATION
    rule: Chapter 14A rules for Residential Suburban, Density Transition, Medium Density
      and Visitor Accommodation inside an Urban Intensification Area
    reason: About 40 ha of these zones lie inside the Policy 3 Area, where 14A.4,
      14A.8 and 14A.9 apply instead of chapter 14. Chapter 14's rules are used throughout.
    likely_effect: unknown
  - zones:
      - RES_HRZ
      - RES_MRZ
    rule: Height in relation to boundary exemption for the front 20 m or 60% of site
      depth, whichever is lesser
    reason: 14A.6.2.2(c)(iv) and 14A.5.2.6(b)(v) exempt the front part of a side boundary
      for three or more units. Encoded at 20 m; on sites shallower than 33 m the 60%
      depth is the lesser and the exemption is overstated.
    likely_effect: overstates
  - zones: RES_NEW_NEIGHBOURHOOD
    rule: Residential New Neighbourhood outline development plans
    reason: Heights of 9 to 13 m by density area (Prestons, Wigram, Yaldhurst) and
      the plans' roads and reserves are not modelled; the zone's 8 m and general standards
      apply.
    likely_effect: understates
  - zones: BUS_MIXED_USE
    rule: Mixed Use Zone residential activity at Addington, Mandeville Street and
      New Brighton
    reason: Permitted only in the areas of Appendix 15.15.10, which are not mapped
      as features; the zone is counted as business floorspace only.
    likely_effect: understates
  - zones: BUS_NEIGHBOURHOOD_CENTRE
    rule: Neighbourhood Centre heights in the Central City (20 m and 32 m)
    reason: 15.6.2.1(ii); the zone's 14 m is used everywhere.
    likely_effect: understates
  - rule: Rail corridor setback of 4 m
    reason: No boundary class for a rail corridor; not applied.
    likely_effect: overstates
  - rule: Defence Wigram helipad surfaces and radio communication pathways
    reason: Christchurch Airport's surfaces are modelled (airspace_christchurch_airport).
      Wigram's two narrow helipad fans (6.7.5.2) and the radio communication pathways
      (6.12; the layer is published empty) are not.
    likely_effect: overstates
  - rule: Hazard and heritage qualifying matters
    reason: Flood, slope, tsunami and coastal hazard areas, heritage items and settings
      are flagged; their rules are largely activity status or design matters rather
      than numbers. Slope hazard areas where building is non-complying or prohibited
      are therefore overstated.
    likely_effect: overstates
  - zones:
      - RES_MRZ
      - RES_HRZ
    rule: Building length, outlook space, outdoor living space and separation standards
    reason: '14A.5.2.17 and 14A.6.2.17 (30 m elevations), 14A.6.2.5 (10 m between
      units above 12 m), outlook and outdoor living spaces: layout standards the envelope
      does not represent.'
    likely_effect: overstates

