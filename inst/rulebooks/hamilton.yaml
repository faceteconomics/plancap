overlays:
  infrastructure_grz:
    label: Three Waters Infrastructure Capacity Overlay (General Residential)
    type: parameters
    layer: infrastructure_capacity
    combine: replace
    applies_to_zones: GRZ
    parameters:
      method: hybrid
      density:
        site_area_per_dwelling: 200.0
        source: 'HCC ODP 4.2.5.1: average net site area 200 m2 per unit'
    source: 'HCC ODP 4.2.5.1: density inside the Three Waters Infrastructure Capacity
      Overlay'
  infrastructure_mrz:
    label: Three Waters Infrastructure Capacity Overlay (Medium Density Residential)
    type: parameters
    layer: infrastructure_capacity
    combine: replace
    applies_to_zones: MRZ
    parameters:
      method: hybrid
      density:
        site_area_per_dwelling: 150.0
        source: 'HCC ODP 4.3.4.1: average net site area 150 m2 per unit'
    source: 'HCC ODP 4.3.4.1: density inside the Three Waters Infrastructure Capacity
      Overlay'
  gully_hazard:
    label: Waikato Riverbank and Gully Hazard Area
    type: exclusion
    layer: gully_hazard
    removes: all
    buffer: 6.0
    source: 'HCC ODP 22.3, 22.2.1l: new buildings D and vulnerable use to avoid the
      area; 4.2.5.6, 4.3.4.6, 4.4.5.6, 4A R38, 6.4.3: 6 m setback'
areas:
  rotokauri_north:
    label: Rotokauri North Residential Precinct
    layer: precincts
    combine: replace
    filter:
      Name: Rotokauri North Residential Precinct
    applies_to_zones: MRZ
    parameters:
      height:
        value: 11.0
        source: 'HCC ODP 4.3.4.4 b: Rotokauri North Residential Precinct 11 m'
      setbacks:
        - kind: upper_level
          distance: 8.0
          above_height: 5.0
          boundaries: rear
          source: 'HCC ODP 4.3.4.6 m: rear yard 8 m for a building over 5 m (four
            or more units)'
    source: 'HCC ODP 4.3.4.4 b, 4.3.4.6 m-o: Rotokauri North Residential Precinct'
unmodelled_rules:
  - zones:
      - GRZ
      - MRZ
      - HDZ
    rule: Separation between residential buildings on a site; upper-floor balcony
      setbacks
    reason: A single envelope per site does not place separate buildings or balconies.
    likely_effect: overstates
    source: HCC ODP 4.2.5.6, 4.3.4.6, 4.4.5.6
  - zones:
      - GRZ
      - MRZ
      - HDZ
    rule: Outlook space, outdoor living area, front landscaping, tree canopy, wall
      articulation
    reason: Depend on where buildings, windows and planting go, which a blank-slate
      envelope does not know.
    likely_effect: overstates
    source: HCC ODP 4.2.5.3, 4.2.5.9, 4.2.5.10, 4.2.5.13 and equivalents
  - zones:
      - MRZ
      - HDZ
      - B6G
      - B6M
    rule: Maximum average net site area (MRZ, HDZ) and minimum residential density
      (Business 6)
    reason: These require a minimum intensity; they do not cap capacity.
    likely_effect: either
    source: HCC ODP 4.3.4.1, 4.4.5.1, 6.4.7
  - zones:
      - GRZ
      - MRZ
    rule: Building coverage of 60% for terraces and apartments with rear-lane parking
    reason: Needs a rear lane, which the extract does not identify.
    likely_effect: understates
    source: HCC ODP 4.2.5.2 b, 4.3.4.2 b
  - zones: PMRZ
    rule: 'Peacocke: 50% coverage for single and duplex units; Increased Height Overlay
      (16 m); bat habitat setback'
    reason: The 60% terrace and apartment coverage is used; the height overlay and
      bat habitat layers are not held.
    likely_effect: either
    source: HCC ODP 4A R34, R37, R38
  - zones: LLRZ
    rule: 'Large Lot: 2 ha density in the Percival and Ryburn Road area'
    reason: The area is not mapped as a layer.
    likely_effect: overstates
    source: HCC ODP 4.5.4.1
  - zones:
      - GRZ
      - MRZ
      - LLRZ
    rule: Te Rapa Racecourse, Ruakura, Te Awa Lakes and Rototuna North East precinct
      rules
    reason: Staging, structure plan and expressway rules that depend on infrastructure
      delivery or on layers not held.
    likely_effect: either
    source: HCC ODP 4.2, 4.3 precinct rules
  - zones: MRZ
    rule: 'Rotokauri North: other precinct standards (front yard, site-wide density)'
    reason: Only the 11 m height and the 8 m rear yard above 5 m are entered.
    likely_effect: either
    source: HCC ODP 4.3.4.6 m-o

