      - kind: plane
        angle_deg: 45.0
        start_height: 3.0
        boundaries: road
        source: 'HCC ODP 4.5.4.5: 45 degrees from 3 m along a transport corridor'
    ratios:
      coverage_max:
        value: 0.2
        source: HCC ODP 4.5.4.2
      landscaping_min:
        value: 0.7
        source: 'HCC ODP 4.5.4.3 b: permeable surface 70%'
    density:
      site_area_per_dwelling: 2500.0
      minor_dwellings_per_site: 1.0
      source: 'HCC ODP 4.5.4.1: 2,500 m2 per residential unit (SH26 Ruakura Structure
        Plan area); 4.5.3.1 ancillary unit P'
    use:
      residential: yes
      business: no
