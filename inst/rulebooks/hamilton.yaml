    ratios:
      coverage_max:
        value: 0.6
        source: HCC ODP 4.4.5.2
      landscaping_min:
        value: 0.1
        source: HCC ODP 4.4.5.3
      impervious_max:
        value: 0.8
        source: HCC ODP 4.4.5.3
    use:
      residential: yes
      business: no
      source: HCC ODP 4.4.3.1
    source: HCC ODP 4.4 High Density Residential Zone
  LLRZ:
    label: Large Lot Residential Zone
    method: hybrid
    height:
      value: 10.0
      occupiable: 10.0
      source: HCC ODP 4.5.4.4
    setbacks:
      - kind: yard
        distance: 5.0
        boundaries: road
        source: HCC ODP 4.5.4.6 a
      - kind: yard
        distance: 1.5
        boundaries: side
        source: HCC ODP 4.5.4.6 b
      - kind: yard
        distance: 1.5
        boundaries: rear
        source: HCC ODP 4.5.4.6 d
      - kind: plane
        angle_deg: 45.0
        start_height: 3.0
        angle_by_bearing:
          - angle_deg: 28.0
            from_deg: 135.0
            to_deg: 225.0
        boundaries:
          - side
          - rear
        source: 'HCC ODP 4.5.4.5: 28 degrees between north-west and north-east (Figure
