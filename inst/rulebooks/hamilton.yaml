      - kind: yard
        distance: 1.0
        boundaries: road
        source: 'HCC ODP 4.4.5.6: local and collector transport corridors'
      - kind: yard
        distance: 1.0
        boundaries: side
        source: HCC ODP 4.4.5.6
      - kind: yard
        distance: 1.0
        boundaries: rear
        source: HCC ODP 4.4.5.6
      - kind: upper_level
        distance: 4.0
        above_height: 11.0
        boundaries:
          - side
          - rear
        source: 'HCC ODP 4.4.5.14: parts over 11 m set back 4 m from side and rear
          boundaries'
      - kind: plane
        angle_deg: 45.0
        start_height: 4.0
        boundaries:
          - side
          - rear
        when:
          adjacent_zones: GRZ
        source: 'HCC ODP 4.4.5.5: 45 degrees from 4 m along a General Residential
          boundary'
      - kind: plane
        angle_deg: 60.0
        start_height: 6.0
        boundaries:
          - side
          - rear
        when:
          beyond_frontage: 20.0
          adjacent_zones: MRZ
