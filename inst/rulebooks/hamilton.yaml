    setbacks:
      - kind: yard
        distance: 1.5
        boundaries: road
        source: HCC ODP 4A R38
      - kind: yard
        distance: 1.0
        boundaries: side
        source: HCC ODP 4A R38
      - kind: yard
        distance: 1.0
        boundaries: rear
        source: HCC ODP 4A R38
      - kind: plane
        angle_deg: 60.0
        start_height: 4.0
        boundaries:
