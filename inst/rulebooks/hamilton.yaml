# Hamilton City Operative District Plan: the walkthrough rulebook.
#
# Entered through the Excel template (inst/extdata/hamilton_rulebook.xlsx) by
# data-raw/hamilton/fill_template.R from the ePlan revision of 13 November 2026.
# Built out in stages (data-raw/hamilton/PLAN.md); PC14 rules are proposed;
# check the plan itself before relying on any value.

# plancap rulebook (schema 0.1)
# Hamilton City Operative District Plan
schema_version: '0.1'
plan:
  name: Hamilton City Operative District Plan
  id: hamilton-odp-2026
  jurisdiction: Hamilton
  country: NZ
  effective_date: '2026-11-13'
  units: m
  source: Hamilton City Operative District Plan, ePlan revision 13 November 2026 (Plan
    Change 12 operative 20 December 2024)
  notes: Entered through the Excel template from the ePlan; built out in stages (data-raw/hamilton/PLAN.md).
    Plan Change 14 (Flooding) rules are proposed, flagged where used.
defaults:
  storey_height: 3.0
  min_floorplate: 30.0
  level_reference: ceiling
  terrain: flat
  site_shape_factor: yes
  large_site:
    method: envelope
    threshold: 10000.0
    deduction: 0.25
morphology:
  reserve_families: OPEN_SPACE
  road_class_field: FIRST_Road_Classification
conversion:
  dwelling_size: 100.0
  efficiency: 0.85
  min_one_dwelling: yes
  source: 'Assumption for the walkthrough: 100 m2 gross per dwelling, 85% of floor
    area in dwellings'
variant_choice: max
zone_families:
  RESIDENTIAL:
    - GRZ
    - MRZ
    - HDZ
    - LLRZ
    - PMRZ
  BUSINESS:
    - B6G
    - B6M
    - B2
  OPEN_SPACE: OSZ
zone_map:
  General Residential: GRZ
  Medium Density Residential: MRZ
  High Density Residential: HDZ
  Large Lot Residential: LLRZ
  Peacocke Medium Density Residential: PMRZ
  Business 6 (General Residential): B6G
  Business 6 (Medium Density Residential): B6M
  Business 2: B2
  Community Facilities: CFZ
  Major Facilities: MFZ
  Open Space: OSZ
  Industrial: INZ
  Transport Corridor: TCZ
zones:
  GRZ:
    label: General Residential Zone
    method: volumetric
    height:
      value: 10.0
      occupiable: 10.0
      roof_allowance: 1.0
      source: HCC ODP 4.2.5.4
    setbacks:
      - kind: yard
        distance: 1.5
        boundaries: road
        source: 'HCC ODP 4.2.5.6 a: local and collector transport corridors'
      - kind: yard
        distance: 1.5
        boundaries: side
        source: HCC ODP 4.2.5.6 b
      - kind: yard
        distance: 1.5
        boundaries: rear
        source: HCC ODP 4.2.5.6 d
      - kind: plane
        angle_deg: 45.0
        start_height: 4.0
        boundaries:
          - side
          - rear
        source: 'HCC ODP 4.2.5.5: 45 degrees from 4 m, all boundaries except a road'
      - kind: yard
        distance: 5.0
        boundaries:
          - state_highway
          - major_arterial_road
          - minor_arterial_road
        source: 'HCC ODP 4.2.5.6 a: arterial transport corridors'
    ratios:
      coverage_max:
        value: 0.45
        source: HCC ODP 4.2.5.2
      landscaping_min:
        value: 0.2
        source: HCC ODP 4.2.5.3 b
      impervious_max:
        value: 0.7
        source: HCC ODP 4.2.5.3 a
    density:
      minor_dwellings_per_site: 1.0
      source: 'HCC ODP 4.2.3.1, 4.2.6.1: ancillary residential unit, one per site'
    use:
      residential: yes
      business: no
      source: HCC ODP 4.2.3.1
    source: HCC ODP 4.2 General Residential Zone
  MRZ:
    label: Medium Density Residential Zone
    method: volumetric
    height:
      value: 18.0
      occupiable: 18.0
      roof_allowance: 1.0
      storeys: 5.0
      source: HCC ODP 4.3.4.4 a
    setbacks:
      - kind: yard
        distance: 1.5
        boundaries: road
        source: HCC ODP 4.3.4.6 a ii
      - kind: yard
        distance: 1.0
        boundaries: side
        source: HCC ODP 4.3.4.6 b
      - kind: yard
        distance: 1.0
        boundaries: rear
        source: HCC ODP 4.3.4.6 d
      - kind: plane
        angle_deg: 60.0
        start_height: 4.0
        boundaries:
          - side
          - rear
        when:
          not_adjacent_zones: GRZ
        variant: single_duplex
        source: 'HCC ODP 4.3.4.5 a: single and duplex units, 60 degrees from 4 m'
      - kind: plane
        angle_deg: 45.0
        start_height: 4.0
        boundaries:
          - side
          - rear
        when:
          adjacent_zones: GRZ
        variant: single_duplex
        source: 'HCC ODP 4.3.4.5 a: 45 degrees from 4 m along a General Residential
          boundary'
      - kind: upper_level
        distance: 4.0
        above_height: 11.0
        boundaries: side
        when:
          within_frontage: 20.0
          not_adjacent_zones: GRZ
        variant: attached
        source: 'HCC ODP 4.3.4.5 b: within 20 m of the road, parts over 11 m set back
          4 m from side boundaries'
      - kind: plane
        angle_deg: 60.0
        start_height: 6.0
        boundaries:
          - side
          - rear
        when:
          beyond_frontage: 20.0
          not_adjacent_zones: GRZ
        variant: attached
        source: 'HCC ODP 4.3.4.5 b, Figure 4.3.4.5 b: beyond 20 m of the road, 60
          degrees from 6 m'
      - kind: plane
        angle_deg: 45.0
        start_height: 4.0
        boundaries:
          - side
          - rear
        when:
          adjacent_zones: GRZ
        variant: attached
        source: 'HCC ODP 4.3.4.5 b: boundaries adjoining other zones take 4.3.4.5
          a'
      - kind: yard
        distance: 5.0
        boundaries:
          - state_highway
          - major_arterial_road
          - minor_arterial_road
        source: 'HCC ODP 4.3.4.6 a iii: arterial transport corridors'
    ratios:
      coverage_max:
        value: 0.5
        source: HCC ODP 4.3.4.2
      landscaping_min:
        value: 0.2
        source: HCC ODP 4.3.4.3
      impervious_max:
        value: 0.7
        source: HCC ODP 4.3.4.3
    use:
      residential: yes
      business: no
      source: HCC ODP 4.3.3.1
    source: HCC ODP 4.3 Medium Density Residential Zone
  HDZ:
    label: High Density Residential Zone
    method: volumetric
    height:
      value: 26.0
      occupiable: 26.0
      roof_allowance: 1.0
      source: HCC ODP 4.4.5.4
    setbacks:
      - kind: yard
        distance: 5.0
        boundaries:
          - state_highway
          - major_arterial_road
          - minor_arterial_road
