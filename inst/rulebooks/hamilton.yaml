      source: HCC ODP 4A R1-R4
    source: HCC ODP Chapter 4A Medium Density Residential Zone, Peacocke Precinct
  B6G:
    label: Business 6 Zone, adjacent to the General Residential Zone
    method: volumetric
    height:
      value: 11.0
      occupiable: 11.0
      roof_allowance: 1.0
      source: HCC ODP 6.4.1
    setbacks:
      - kind: yard
        distance: 5.0
        boundaries:
          - state_highway
          - major_arterial_road
          - minor_arterial_road
        source: 'HCC ODP 6.4.3: 5 m when fronting an arterial transport corridor'
      - kind: yard
        distance: 1.5
        boundaries:
          - side
          - rear
        when:
          adjacent_zones: RESIDENTIAL
        source: 'HCC ODP 6.4.3: Business 6, 1.5 m where the boundary adjoins a Residential
          Zone'
      - kind: plane
        angle_deg: 45.0
        start_height: 4.0
        boundaries:
          - side
          - rear
        when:
          adjacent_zones: GRZ
        source: 'HCC ODP 6.4.2: adjoining General Residential'
      - kind: plane
        angle_deg: 60.0
        start_height: 4.0
        boundaries:
          - side
          - rear
        when:
          adjacent_zones: MRZ
        source: 'HCC ODP 6.4.2: adjoining Medium Density Residential'
    ratios:
      far_max:
        value: 2.0
        source: HCC ODP 6.4.4
    use:
      residential: yes
      business: yes
      residential_share:
        bands:
          by: storey
          bands:
            - min: 0.0
              max: 1.0
              value: 0.0
            - min: 1.0
              value: 1.0
          source: 'HCC ODP 6.4.7 b: no residential activity at ground floor'
      source: 'HCC ODP 6.3, 6.4.7: no residential activity at ground floor'
