# Hamilton City Operative District Plan: the walkthrough rulebook.
#
# Entered through the Excel template (inst/extdata/hamilton_rulebook.xlsx) by
# data-raw/hamilton/fill_template.R from the ePlan revision of 13 November 2026.
# Built out in stages (data-raw/hamilton/PLAN.md); PC14 rules are proposed;
# check the plan itself before relying on any value.

# plancap rulebook (schema 0.1)
# Hamilton City Operative District Plan
schema_version: '0.1'
plan:
  name: Hamilton City Operative District Plan
  id: hamilton-odp-2026
  jurisdiction: Hamilton
  country: NZ
  effective_date: '2026-11-13'
  units: m
  source: Hamilton City Operative District Plan, ePlan revision 13 November 2026 (Plan
    Change 12 operative 20 December 2024)
  notes: Entered through the Excel template from the ePlan; built out in stages (data-raw/hamilton/PLAN.md).
    Plan Change 14 (Flooding) rules are proposed, flagged where used.
defaults:
  storey_height: 3.0
  min_floorplate: 30.0
  level_reference: ceiling
  terrain: flat
  site_shape_factor: yes
  large_site:
    method: envelope
    threshold: 10000.0
    deduction: 0.25
morphology:
  reserve_families: OPEN_SPACE
  road_class_field: FIRST_Road_Classification
conversion:
  dwelling_size: 100.0
  efficiency: 0.85
  min_one_dwelling: yes
  source: 'Assumption for the walkthrough: 100 m2 gross per dwelling, 85% of floor
    area in dwellings'
variant_choice: max
zone_families:
  RESIDENTIAL:
    - GRZ
    - MRZ
    - HDZ
    - LLRZ
    - PMRZ
  BUSINESS:
    - B1
    - B2
    - B3
    - B4
    - B4I
    - B5
    - B6G
    - B6M
    - B7
    - PNCZ
    - PLCZ
    - CC1
    - CC2
    - CC3
    - RTC
  OPEN_SPACE: OSZ
zone_map:
  General Residential: GRZ
  Medium Density Residential: MRZ
  High Density Residential: HDZ
  Large Lot Residential: LLRZ
  Peacocke Medium Density Residential: PMRZ
  Business 6 (General Residential): B6G
  Business 6 (Medium Density Residential): B6M
  Business 2: B2
  Business 1: B1
  Business 3: B3
  Business 4: B4
  Business 4 (Industrial): B4I
