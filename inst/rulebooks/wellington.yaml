# Wellington City District Plan 2024 (Wellington)
#
# Converted from capacityengine's wcc-dp-2024.yaml on 2026-11-20.
# A dated worked example, maintained by the package author: check the plan
# itself before relying on any value. Values carry their rule citation where
# the source bundle recorded one (validate_rulebook() lists those without).
# Fields the conversion could not carry are listed in the unmodelled_rules
# register and in data-raw/conversion/ in the package source.

schema_version: '0.1'
plan:
  name: Wellington City District Plan 2024
  id: wcc-dp-2024
  jurisdiction: Wellington
  country: NZ
  effective_date: '2026-10-16'
  units: m
  hemisphere: south
  source: Wellington City 2024 District Plan, ePlan revision 154 (16 October 2026),
    read 29 October 2026
  notes: Converted from the capacityengine bundle wcc-dp-2024.yaml by plancap data-raw/convert_capacityengine.R
    on 2026-11-20. Precinct areas match a precinct_key column holding the normalised
    precinct name.
defaults:
  storey_height: 3.0
  min_floorplate: 30.0
  level_reference: ceiling
  no_limit_height: 216.0
  large_site:
    method: divisor
    threshold: 10000.0
    deduction: 0.25
morphology:
  reserve_families: OPEN_SPACE_ANY
conversion:
  dwelling_size: 120.0
  efficiency: 0.8
  min_one_dwelling: yes
  min_one_dwelling_floor: 60.0
  source: 'capacityengine conversion: 120 m2 a dwelling plus 0.2 circulation and 0.05
    storage. 150 m2 consumed per dwelling, as for Auckland (PC120 report p50) and
    Christchurch.'
ground:
  mode: most_restrictive
variant_choice: max
zone_families:
  RES_ANY:
    - RES_MRZ
    - RES_MRZ14
    - RES_HRZ
    - RES_LARGE_LOT
  RES_MRZ_ANY:
    - RES_MRZ
    - RES_MRZ14
  CENTRE_ANY:
    - BUS_CITY_CENTRE
    - BUS_METRO_CENTRE
    - BUS_LOCAL_CENTRE
    - BUS_NEIGHBOURHOOD_CENTRE
  COMMERCIAL_ANY:
    - BUS_CITY_CENTRE
    - BUS_METRO_CENTRE
    - BUS_LOCAL_CENTRE
    - BUS_NEIGHBOURHOOD_CENTRE
    - BUS_MIXED_USE
  BUS_ANY:
    - BUS_CITY_CENTRE
    - BUS_METRO_CENTRE
    - BUS_LOCAL_CENTRE
    - BUS_NEIGHBOURHOOD_CENTRE
    - BUS_MIXED_USE
    - BUS_INDUSTRIAL
  OPEN_SPACE_ANY:
    - NOSZ
    - OSZ
    - SARZ
  RURAL_ANY: GRUZ
  SPECIFIC_PURPOSE_ANY:
    - WTBZ
    - AIRPZ
    - QUARZ
    - PORTZ
    - CORZ
    - TEDZ
    - WFZ
    - HOSZ
    - STADZ
  TOWN_BELT: WTBZ
zone_map:
  MRZ: RES_MRZ
  MRZ14: RES_MRZ14
  HRZ: RES_HRZ
  LLRZ: RES_LARGE_LOT
  CCZ: BUS_CITY_CENTRE
  MCZ: BUS_METRO_CENTRE
  LCZ: BUS_LOCAL_CENTRE
  NCZ: BUS_NEIGHBOURHOOD_CENTRE
  MUZ: BUS_MIXED_USE
  GIZ: BUS_INDUSTRIAL
  GRUZ: GRUZ
  NOSZ: NOSZ
  OSZ: OSZ
  SARZ: SARZ
  WTBZ: WTBZ
  AIRPZ: AIRPZ
  QUARZ: QUARZ
  PORTZ: PORTZ
  CORZ: CORZ
  TEDZ: TEDZ
  WFZ: WFZ
  HOSZ: HOSZ
  STADZ: STADZ
