        distance: 10.0
        boundaries: coastal
        source: 'WDP CE-R15.3: coastal margin, 10 m landward of the coastal marine
          area; new buildings discretionary outside the Airport, Port, Stadium, Waterfront
          and City Centre zones'
      - kind: plane
        angle_deg: 60.0
        start_height: 4.0
        boundaries:
          - side
          - rear
