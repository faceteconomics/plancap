      occupiable: 11.0
      roof_allowance: 1.0
      storeys: 3.0
      source: 'WDP MRZ-S2.1.a (Height Area 1): 11 m, plus 1 m for 50% of the roof
        where it slopes 15 degrees or more'
    setbacks:
      - kind: yard
        name: front
        distance: 1.5
        boundaries: road
        source: WDP MRZ-S4, multi-unit housing
      - kind: yard
        name: side
        distance: 1.0
        boundaries: side
        source: WDP MRZ-S4, multi-unit housing
      - kind: yard
        name: rear
        distance: 1.0
        boundaries: rear
        source: WDP MRZ-S4, multi-unit housing (excluded on corner sites, not modelled)
      - kind: yard
        name: riparian
        distance: 10.0
        boundaries: riparian
        source: 'WDP NATC-R5, CE-R15.3: riparian margin, 10 m from the bed of a river
          (not piped); building in it restricted discretionary with no limit, or discretionary
          in the coastal environment'
      - kind: yard
