overlays:
  height_control:
    type: height
    layer: wcc_height_modelled
    combine: replace
    value_field: height_m
    enabled: yes
    precedence: 50.0
    source: WDP CCZ-S1, MCZ-S1, LCZ-S1, NCZ-S1, MUZ-S2, GIZ-S2, HH-S1, MRZ-PREC03-S3;
      WIAL1 Figure 1
  ccz_cbd_west_msl:
    type: height_surface
    layer: wcc_ccz_msl
    combine: cap
    applies_to_zones: BUS_CITY_CENTRE
    enabled: yes
    precedence: 60.0
    source: 'WDP CCZ-S1, Height Control Area 6 (CBD West): 75, 85, 90 and 95 m above
      mean sea level (NZVD2016)'
    notes: 'Extent layer in capacityengine: wcc_ccz_msl.'
  airspace_wial:
    type: height_surface
    layer: wial_ols
    combine: cap
    floor_value: 8.0
    enabled: yes
    precedence: 100.0
    source: 'WDP designation WIAL1, Conditions 1 (Obstacle Limitation Surfaces), 1-4:
      8 m above existing ground where a surface is penetrated'
    notes: |-
      Decision 6. Figure 1 properties are left out of the extent; their own heights are in height_control. Shielding by existing immovable objects is not modelled. A run without this overlay and airspace_wial_outer is reported apart.
