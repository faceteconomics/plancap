unmodelled_rules:
  - zones:
      - RES_MRZ
      - RES_MRZ14
      - RES_HRZ
      - RES_LARGE_LOT
      - BUS_CITY_CENTRE
      - BUS_MIXED_USE
      - BUS_INDUSTRIAL
    rule: Restricted discretionary breaches with no stated limit
    reason: 'User decision: restricted discretionary is part of capacity where the
      band is bounded. Almost every height, recession plane and setback breach in
      the 2024 District Plan is RD with no limit (e.g. MRZ-R12.2, HRZ-R12.2, CCZ-R24.2,
      MUZ-R18.2), so the stated standard is used.'
    likely_effect: understates
  - zones:
      - RES_MRZ
      - RES_MRZ14
      - RES_HRZ
    rule: One to three unit standard set in MRZ and HRZ
    reason: MRZ-S1/S4 and HRZ-S1/S4 let one to three units build with no front or
      side yard (MRZ) and to 14 m (HRZ). The multi-unit housing set is used throughout
      (decision 3); on small MRZ sites the yard-free path would give a little more.
    likely_effect: understates
  - zones:
      - RES_HRZ
      - BUS_MIXED_USE
    rule: Recession planes beside heritage areas, heritage buildings, character precincts,
      schools, Maori sites and notable trees
    reason: HRZ-S3.3 and MUZ-S3 lower the plane to 5 m beside these; the engine's
      adjacency test reads zones only.
    likely_effect: overstates
  - rule: Rail corridor setback of 1.5 m
    reason: No boundary class for a rail corridor; not applied (MRZ-S4, HRZ-S4, MCZ-S12
      and the others).
    likely_effect: overstates
  - zones: BUS_CITY_CENTRE
    rule: Minimum sunlight access to public space (CCZ-S6, APP9)
    reason: Buildings must keep 70% of mapped public spaces in sun at stated times;
      a shading solve, not modelled. Sites near the 28 mapped spaces are flagged (sunlight_access).
    likely_effect: overstates
  - zones: BUS_CITY_CENTRE
    rule: Old St Paul's adjoining-site planes and building line (CCZ-S2)
    reason: A handful of sites around Old St Paul's; not modelled.
    likely_effect: overstates
  - zones:
      - BUS_MIXED_USE
      - BUS_INDUSTRIAL
    rule: 'Floor area caps: Mixed Use 500 m2 a building (MUZ-S6), General Industrial
      4,000 m2 a site beside a residential zone (GIZ-S4)'
    reason: MUZ-S6 caps each building, not the site, so several buildings may stand
      on one site; GIZ-S4 caps a site's total, which the engine has no rule for. Breaches
      are RD with no limit.
    likely_effect: overstates
  - rule: Viewshaft geometry
    reason: Each SCHED5 viewshaft is built as a line of sight falling evenly from
      the viewpoint's eye level to its base level over the distance to the base, within
      the mapped wedge (build_height_surfaces.R); the schedule's margins and stepped
      bases (VS8) are not drawn exactly.
    likely_effect: unknown
  - rule: WIAL1 shielding exemption and the council's 2025 recommendation
    reason: An object shielded by an existing immovable object is exempt from the
      surfaces; not modelled. The council recommended in June 2025 that WIAL exclude
      terrain-shielded areas and raise the allowance to 11 m; the designation still
      reads 8 m.
    likely_effect: understates
  - rule: Natural hazard activity status
    reason: New hazard sensitive activities (residential) in high hazard areas are
      non-complying or discretionary (CE-R26, CE-R27, NH chapter); flagged, with a
      sensitivity removing them (decision 8).
    likely_effect: overstates
  - rule: Development area plans
    reason: Lincolnshire Farm, Upper Stebbings and Glenside West and the Kilbirnie
      Bus Barns have development plans (APP11-13) with roads, reserves and building
      areas; modelled as zoned with the 25% large-site allowance and reported beside
      the master-plan yields (decision 9).
    likely_effect: unknown
  - zones:
      - RES_HRZ
      - BUS_CITY_CENTRE
      - BUS_METRO_CENTRE
      - BUS_LOCAL_CENTRE
      - BUS_NEIGHBOURHOOD_CENTRE
      - BUS_MIXED_USE
    rule: Building length, separation, outlook and outdoor living standards
    reason: 'HRZ-S14 to S16 (20 m length, 10 m between buildings), the centre zones''
      8 m separation and 25 m length for residential buildings, outlook and outdoor
      living spaces: layout standards the envelope does not represent.'
    likely_effect: overstates

