    notes: 'Read in full; no standard changes the envelope or the density the model
      computes, so every site takes its zone. The standards apply in addition to the
      zone''s. Not modelled: the 20.5 m height for THAB sites adjoining Fred Taylor
      Drive (I610.6.3.1, which disapplies H6.6.5 there; the model holds no road names,
      so those sites keep the zone''s 16 m, conservative); the dwelling thresholds
      tied to transport upgrades (I610.6.1) and the 5,400-dwelling limit until the
      Northern Interceptor Stage 2 and North Harbour Water Main 2 are operational
      (I610.6.5.1). Both are staging rules that lapse with the infrastructure, so
      they are timing, not plan-enabled capacity, and are reported rather than applied.
      The rest is stormwater, riparian planting and road design. Item 329.'
