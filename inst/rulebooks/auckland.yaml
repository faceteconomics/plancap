    form:
      tower_above_height: 27.0
      max_tower_dimension: 55.0
      tower_separation: 6.0
    density:
      min_dwelling_size: 30.0
    use:
      residential: yes
      business: yes
      residential_share:
        bands:
          by: storey
          bands:
            - min: 0.0
              max: 1.0
              value: 0.0
            - min: 1.0
              value: 0.5
      source: AUP H10.6.5(1) for the ground floor; the upper-floor share is an assumption
