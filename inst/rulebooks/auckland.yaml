  hobsonville_point:
    layer: precincts
    combine: replace
    filter:
      precinct_key: hobsonville_point
    applies_to_zones:
      - RES_MHU
      - RES_THAB
    sub_area_field: sub_precinct
    sub_areas:
      A:
        label: Hobsonville Point Village
        totals:
          min_dwellings: 274.0
        source: AUP I605.6.1.1
      B:
        label: Buckley
        totals:
          max_dwellings: 1200.0
          min_dwellings: 1080.0
        source: AUP I605.6.1.1
      C:
        label: Sunderland
        totals:
          max_dwellings: 1175.0
          min_dwellings: 592.0
        source: AUP I605.6.1.1
      D:
        label: Airfields
        density:
          dwellings_per_ha: 40.0
        source: AUP I605.6.1.1
    source: 'I605: AUP I605, standards I605.6.1 to I605.6.4'
    notes: The clearest example of why precincts cannot be folded into zone parameters.
      I605.6.1.1 sets MINIMUM dwelling numbers per sub-precinct as well as maxima,
      and the Airfields sub-precinct is a per-hectare density. A minimum is not a
      capacity constraint and must never be applied as one; it is carried so the precinct's
      intent is legible and so a downstream feasibility model can use it. The maxima
      ARE capacity ceilings and apply to the sub-precinct total, after per-site yields
      are summed, not per site. Yards here also carry a MAXIMUM front depth (at least
      1 m, at most 6 m, I605.6.4.2.1), which does not reduce capacity.
unmodelled_rules:
  - zones:
      - RES_MHS
      - RES_MHU
      - RES_THAB
    rule: Height in relation to boundary does not apply where a common wall exists
      or is proposed
    reason: Whether a common wall is proposed is unknowable from the cadastre, so
      the rule cannot reduce to a parameter. Omitting it is conservative.
    likely_effect: understates
  - zones:
      - RES_MHS
      - RES_MHU
      - RES_THAB
    rule: Height in relation to boundary measured from the far side of any entrance
      strip
    reason: 'Entrance strips are now found within each site (item 319: they come off
      net site area, and can be kept clear of building). What remains is the neighbour''s
      case: where a site''s side or rear boundary abuts another site''s entrance strip,
      right of way or access lot, the plane is measured from that strip''s far side,
      so the site may build closer. The engine measures every plane from the site''s
      own boundary (conservative).'
    likely_effect: understates
  - rule: Principal living room, bedroom and habitable room outlook space
    reason: Dimensional but governs window and balcony placement within a building
      rather than the envelope. The report does not list it among the modelled standards.
    likely_effect: overstates
  - rule: Outdoor living space, communal living space for developments over 20 dwellings
    reason: Governs the internal composition of a development, not the envelope.
    likely_effect: overstates
  - rule: Deep soil and canopy tree areas (20 m2 for sites 200-600 m2, 30 m2 for 601-1500
      m2, 50 m2 for 1501 m2 or more)
    reason: Reduces developable ground area and is fully numeric, so it could be modelled
      as an additional landscaping deduction. Not modelled because the report does
      not list it among the standards applied, and adding it would diverge from the
      run being reconciled against.
    likely_effect: overstates
  - rule: Daylight, wind, rainwater tanks, residential waste management, safety and
      privacy buffer, fences and walls
    reason: No capacity-relevant numeric parameter, or governs matters outside the
      envelope.
    likely_effect: unknown
  - rule: Front yard landscape depth 2 m where car parking is visible at street frontage
      (business zones)
    reason: Conditional on a design outcome that cannot be known in advance from the
      cadastre.
    likely_effect: overstates
  - rule: Tower separation 6 m, and maximum tower plan dimension 55 m above 27 m (business
      zones)
    reason: Separation governs the relationship between two towers on one site, and
      the engine models a single floorplate per storey with no concept of separate
      towers. The maximum dimension is a limit on plan dimension, not on area, and
      no floorplate cap follows from it without an assumption about tower shape, which
      would be inventing a rule value. apply_caps() therefore flags affected storeys
      as tower_control_unmodelled and leaves them uncapped.
    likely_effect: overstates
  - rule: 'Coastal protection, riparian and lakeside yards: what the water layers
      miss'
    reason: 'Since item 347 these yards are measured from the water, as J1 defines
      them (from mean high water springs, or the top of a stream''s or lake''s bank),
      and the land within reach comes off each site (build_envelope(water = ); scripts/build_water_features.R).
      Before it they never applied: no boundary was ever classed coastal, riparian
      or lakeside. What remains: intermittent streams, which the riparian yard also
      covers, are not in the council''s stream layer (permanent only), so they get
      no yard; streams are centrelines, so the yard runs from the centre rather than
      the bank, short by half the channel''s width; lakes are LINZ''s 1:50k polygons;
      and the site-specific coastal yards of Appendix 6 are text, not a layer (item
      326), so every coastal yard takes its zone''s or precinct''s figure.'
    likely_effect: overstates
  - rule: Minimum dwelling size 45 m2 for one or more bedroom dwellings
    reason: 'Recorded because it bounds the floorspace to dwellings conversion: at
      150 m2 consumed per dwelling the conversion is far above the minimum, so the
      minimum never binds. It would bind under a smaller dwelling size assumption
      in the sensitivity harness.'
    likely_effect: unknown
  - rule: 'Ridgeline Protection Overlay: buildings breaking the skyline (D15, Table
      D15.4.1 A4)'
    reason: AUP D15.6 has no standards. A building with a sea or sky backdrop above
      the ridgeline is non-complying on a natural ridgeline and discretionary on a
      modified one, so on natural ridgelines that capacity is not plan-enabled at
      all. Deciding it requires a skyline visibility analysis from public places,
      which has no numeric parameter.
    likely_effect: overstates
  - rule: Local Public Views Overlay (D16)
    reason: 'AUP D16.6: there are no standards in the overlay. Activity status and
      visibility assessment only.'
    likely_effect: overstates
  - rule: Maunga viewshaft compliance allowing for landform shielding (D14.6.2)
    reason: 'The plan tests whether a building intrudes into a scheduled viewshaft
      from an identified viewpoint or line, and expressly permits landform to be used
      to demonstrate compliance while excluding vegetation. That is a 3D visibility
      test, not a surface sample. Sampling the viewshaft surface is a conservative
      approximation: it will understate capacity where landform already blocks the
      view.'
    likely_effect: understates
  - rule: Rolling height method in the Maunga Viewshafts and Height Sensitive Areas
      Overlay (D14.6.1(1))
    reason: 'Height inside this overlay is measured by the rolling height method,
      that is against the ground directly below each point of the building, rather
      than from a single site datum. Since item 318 the building steps with the ground
      (terrain = "stepped": it stands on a plane fitted to the site''s boundary ground)
      and each recession plane is measured from its own boundary''s ground, which
      is the rolling method to the accuracy of a plane. What remains: a lot whose
      ground is not close to a plane (a terrace or a bank) is smoothed; and an overlay
      height read off an absolute surface (a viewshaft) is still converted to a height
      at the site''s mean ground, not point by point.'
    likely_effect: unknown
  - rule: 'Special Character Areas Overlay front yard: average of neighbouring setbacks
      (D18.6.1.3.1)'
    reason: 'Modelled: the front yard is the average of existing dwelling setbacks
