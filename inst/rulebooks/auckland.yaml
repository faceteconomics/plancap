          value_from: existing_front_setback
          source: 'D18.6.1.3.1: the average of existing setbacks of dwellings on adjacent
            sites, three either side or six on one side'
        - kind: yard
          name: side
          distance: 1.2
          boundaries: side
          source: D18.6.1.3.1
        - kind: yard
          name: rear
          distance: 3.0
          boundaries: rear
          source: D18.6.1.3.1
        - kind: plane
          angle_deg: 45.0
          start_height: 3.0
          boundaries:
            - road
            - side
            - rear
          source: D18.6.1.2(1); note this applies along ANY boundary, including the
            road frontage
      replaces_setbacks:
        - yard
        - plane
      ratios:
        coverage_max:
          bands:
            by: site_area
            bands:
              - min: 0.0
                max: 200.0
                value: 0.55
              - min: 200.0
                max: 300.0
                value: 0.45
              - min: 300.0
                max: 500.0
                value: 0.4
              - min: 500.0
                max: 1000.0
                value: 0.35
              - min: 1000.0
                value: 0.25
        landscaping_min:
          bands:
            by: site_area
            bands:
              - min: 0.0
                max: 200.0
                value: 0.28
              - min: 200.0
                max: 500.0
                value: 0.33
              - min: 500.0
                max: 1000.0
                value: 0.4
              - min: 1000.0
                value: 0.5
        paved_max:
          bands:
            by: site_area
            bands:
              - min: 0.0
                max: 200.0
                value: 0.17
              - min: 200.0
                max: 500.0
                value: 0.2
              - min: 500.0
                value: 0.25
    enabled: yes
    precedence: 60.0
    source: AUP D18.6.1
    notes: 'Excluded from the PC120 run for time reasons (report p56, footnote 17),
      so it ships off by default and the default run still reconciles. It is a genuine
      and severe capacity constraint, not a nicety: 8 m height and a 45 degree plane
      from 3 m on ANY boundary, applied over an MHU or THAB zone, removes most of
      the enabled envelope. The front yard is NOT a fixed number. D18.6.1.3.1 sets
      it as "the average of existing setbacks of dwellings on adjacent sites, being
      the three sites on either side of the subject site or six sites on one side".
      That is computable from building outlines, and since item 314 it is computed:
      the yard is declared with value_from and add_existing_front_setbacks() measures
      it from LINZ building outlines. Where no neighbouring dwelling is found it is
      reported as unapplied.'
