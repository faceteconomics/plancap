# Auckland Unitary Plan (Operative in part) (Auckland)
#
# Converted from capacityengine's aup-oip-2025.yaml on 2026-11-21.
# A dated worked example, maintained by the package author: check the plan
# itself before relying on any value. Values carry their rule citation where
# the source bundle recorded one (validate_rulebook() lists those without).
# Fields the conversion could not carry are listed in the unmodelled_rules
# register and in data-raw/conversion/ in the package source.

schema_version: '0.1'
plan:
  name: Auckland Unitary Plan (Operative in part)
  id: aup-oip-2025
  jurisdiction: Auckland
  country: NZ
  effective_date: '2026-07-01'
  units: m
  hemisphere: south
  source: Auckland Unitary Plan (Operative in Part), chapter text July 2026
  notes: Converted from the capacityengine bundle aup-oip-2025.yaml by plancap data-raw/convert_capacityengine.R
    on 2026-11-21. Precinct areas match a precinct_key column holding the normalised
    precinct name.
defaults:
  storey_height: 3.0
  min_floorplate: 30.0
  level_reference: ceiling
  no_limit_height: 216.0
  large_site:
    method: divisor
    threshold: 10000.0
    deduction: 0.25
morphology:
  reserve_families: OPEN_SPACE_ANY
  rear_site_sides_as_rear: yes
conversion:
  dwelling_size: 120.0
  efficiency: 0.8
  min_one_dwelling: yes
  min_one_dwelling_floor: 60.0
  source: |
    capacityengine conversion: 120 m2 a dwelling plus 0.2 circulation and 0.05 storage. 150 m2 consumed per dwelling. PC120 report p50. The report's footnote 20 states "120 + (120*(0.2+0.5)) = 150", which evaluates to 204; the intended expression is 120 * (1 + 0.2 + 0.05). The 0.05 here is correct.
ground:
  mode: most_restrictive
variant_choice: max
zone_families:
  BUS_ANY:
    - BUS_BUSINESS_PARK
    - BUS_HEAVY_INDUSTRY
    - BUS_LOCAL_CENTRE
    - BUS_METRO_CENTRE
    - BUS_MIXED_USE
    - BUS_LIGHT_INDUSTRY
    - BUS_TOWN_CENTRE
    - BUS_CITY_CENTRE
    - BUS_NEIGHBOURHOOD_CENTRE
    - BUS_GENERAL_BUSINESS
  RES_ANY:
    - RES_THAB
    - RES_MHS
    - RES_SINGLE_HOUSE
    - RES_RURAL_COASTAL
    - RES_LARGE_LOT
    - RES_MHU
  RES_THAB_ANY: RES_THAB
  OPEN_SPACE_ANY:
    - '31'
    - '32'
    - '33'
    - '34'
    - '62'
  OPEN_SPACE_CONSERVATION: '31'
  OPEN_SPACE_INFORMAL_RECREATION: '32'
  RURAL_PRODUCTION: '16'
  RURAL_ANY:
    - '3'
    - '11'
    - '15'
    - '16'
    - '46'
    - '68'
    - '69'
  OPEN_SPACE_IDENTIFIED:
    - '31'
    - '32'
    - '33'
    - '34'
    - '62'
  OPEN_SPACE_OVER_2000_WIDE:
    zones:
      - '31'
      - '32'
      - '33'
      - '34'
      - '62'
    min_area: 2000.0
    source: capacityengine zone_token_conditions()
  OPEN_SPACE_UNDER_2000:
    zones:
      - '31'
      - '32'
      - '33'
      - '34'
      - '62'
    max_area: 2000.0
    source: capacityengine zone_token_conditions()
  SP_MAORI_PURPOSE: '52'
  SP_SCHOOL: '63'
  BUS_GENERAL_BUSINESS: BUS_GENERAL_BUSINESS
