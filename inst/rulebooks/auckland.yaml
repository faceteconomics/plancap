      table:
        - occupiable: 11.0
          total: 13.0
          source: H10.6.1.1
        - occupiable: 16.0
          total: 18.0
          source: H10.6.1.1
        - occupiable: 19.0
          total: 21.0
          source: H10.6.1.1
        - occupiable: 22.0
          total: 24.0
          source: H10.6.1.1
        - occupiable: 25.0
          total: 27.0
          source: H10.6.1.1
      passthrough_below: 11.0
      passthrough_above: 27.0
      between: passthrough
    filter:
      VERSIONSTATUS: 4.0
      VALIDATIONSTATE: 3.0
    enabled: yes
    precedence: 50.0
    source: AUP H10.6.1(1)-(2) and Table H10.6.1.1; H11.6.1.2; H12; H13; H15.6.1(1);
      H6
    notes: 'An OVERRIDE of the base zone height in both directions, not a cap. The
      zone policies provide for the HVC both to "enable greater building height than
      the standard height" and to "reduce building height below the standard zone
      height ... where the standard zone height would have significant adverse effects
      on identified special character, identified landscape features, amenity or other
      qualifying matters". Encoding it as a cap would lose every site where the HVC
      raises height, which is most of them. Business Park states this explicitly:
      "Buildings must not exceed 20.5m in height, unless otherwise specified in the
      Height Variation Control" (H15.6.1(1)). THAB likewise: "If the site is subject
      to the Height Variation Control, buildings must not exceed the height in metres
      shown for the site on the planning maps" (H6). Business Park and THAB have NO
      occupiable/roof form split, so for those zones the mapped value passes through
      unconverted. The conversion applies to the centre and mixed use zones.'
  maunga_viewshaft:
    type: height_surface
    layer: viewshaft_surface
    combine: cap
    floor_value: 9.0
    filter:
      TYPE: 4.0
      VERSIONSTATUS: 4.0
      VALIDATIONSTATE: 3.0
    enabled: yes
    precedence: 100.0
    source: AUP D14.4.1 (A1)-(A6), D14.6.2, Schedule 9 Maunga Viewshafts Schedule
    notes: |-
      Renamed in the operative plan from Volcanic to Maunga Viewshafts. NOT a pure surface cap. Per Table D14.4.1 a building that does not intrude into a scheduled viewshaft is permitted (A1). A building that DOES intrude is still provided for up to 9 m: restricted discretionary in a regionally significant viewshaft, permitted in a locally significant one (A3). Above that it is non-complying in a regionally significant viewshaft and restricted discretionary in a locally significant one (A6). So effective height under this overlay is max(viewshaft surface above ground, 9 m), not the surface alone. Treating the surface as a hard cap would understate capacity on every site where the surface falls below 9 m, which is exactly the land closest to the maunga. Under the rule inclusion test the regionally significant case resolves to 9 m, because beyond that is non-complying and therefore not plan-enabled. The locally significant case is an open-ended restricted discretionary breach, so the stated 9 m standard is used and the rule is logged. D14.6.2 further allows landform, but not vegetation, to demonstrate non-intrusion, which the surface sample cannot capture. Logged. ONLY THE REGIONALLY SIGNIFICANT viewshafts are loaded. The council publishes the locally significant ones as a separate service, and this overlay's class_field therefore has nothing to read: significance is which service a feature came from, not a column on it. Until the locally significant layer is loaded too, capacity is OVERSTATED wherever only a locally significant viewshaft applies. Flagged rather than assumed away.
       Extent layer in capacityengine: volcanic_viewshafts_and_hsa.
  height_and_building_sensitive_area:
    type: height
    value: 9.0
    layer: volcanic_viewshafts_and_hsa
    combine: cap
    filter:
      TYPE: 3.0
      VERSIONSTATUS: 4.0
      VALIDATIONSTATE: 3.0
    enabled: yes
    precedence: 90.0
    source: AUP D14.4.1 (A7), (A8), (A11)
    notes: 'A flat height, not a layer attribute. This corrects an earlier reading
      taken from the superseded 2016 Decision version, which said "the height defined
      on the planning maps or otherwise 9m". The operative plan states it directly:
      buildings up to 9 m are permitted (A7), up to 13 m in the areas identified in
      Figure D14.10.1 (A8), and anything else is non-complying (A11). Non-complying
      is outside the permitted, controlled and restricted discretionary test, so 9
      m (or 13 m) is a hard cap on plan-enabled capacity rather than a soft standard.
      Height here is measured by the ROLLING HEIGHT METHOD (D14.6.1(1)), against the
      ground below each point of the building rather than a single site datum, except
      where the D14.6.3 limbs apply and height is an absolute RL above NZVD2016. The
      13m sub_areas are NOT AVAILABLE as a layer: Figure D14.10.1 is a figure in the
      plan text and the council does not publish its extent, and the coded domain''s
      "Blanket Height Sensitive Areas" value carries no features. So every site under
      this overlay takes 9m, which UNDERSTATES capacity wherever the 13m areas actually
      reach. Flagged rather than guessed.'
  public_views:
    type: flag
    layer: public_views
    enabled: yes
    precedence: 85.0
    source: AUP D16
    notes: 'NOT a height cap. AUP D16.6: "There are no standards in this overlay."
      Same structure as ridgeline protection: controlled by activity status and a
      visibility assessment, with no numeric parameter to model.'
  ridgeline_protection:
    type: flag
    layer: ridgeline_protection
    enabled: yes
    precedence: 80.0
    source: AUP D15
    notes: 'NOT a height cap. AUP D15.6 states in terms: "There are no standards in
      this section." The overlay works through activity status, not a number. Buildings
      under 1 m are permitted; buildings not visible above the ridgeline from a public
      place are restricted discretionary; buildings with a sea or sky backdrop above
      the ridgeline are non-complying on natural ridgelines and discretionary on modified
      ridgelines. Because non-complying sits outside the permitted/controlled/RD test,
      capacity that would break the skyline on a natural ridgeline is not plan-enabled
      at all. Determining that requires a skyline visibility analysis from public
      places, which has no numeric parameter, so the overlay is carried as a flag
      and recorded in unmodelled_rules.'
