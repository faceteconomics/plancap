    notes: 'No base numeric height was found in H10; the zone takes its height from
      the Height Variation Control. Confirm against a clean copy of H10. The ground-floor
      zero is very slightly conservative: H10.6.5(1) bites only where the dwelling
      fronts a street or public open space, so a ground-floor dwelling at the rear
      of a deep site is permitted and is not counted here. Flagged rather than modelled,
